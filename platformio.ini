kiểm# PlatformIO configuration for AG32 HMI Project
# MCU: AG32VF407 (LQFP-64), Display: 5.0" RGB 800x480

[platformio]
src_dir = .
include_dir = ./src
default_envs = debug

[setup]
board = agrv2k_103
framework = agrv_sdk
program = hmi_app
build_src_filter = "-<*> +<./src/**/*.c>"
release_build_flags = -Os -g

[setup_logic]
logic_ve = rgb.ve
logic_device = AGRV2KL64H
logic_compress = true
ip_name = hram_ip
logic_dir = logic
logic_ip = true

[setup_upload]
protocol = cmsis-dap-openocd
debug_tool = ${this.protocol}
upload_protocol = ${this.protocol}
upload_srst = true

[setup_monitor]
logger_if = UART0
monitor_port = COM*
monitor_speed = 115200

[setup_batch]

[env]
platform = AgRV
extends =
  setup
  setup_logic
  setup_upload
  setup_monitor
  setup_batch

[env:debug]
build_type = debug

[env:release]
build_type = release

[env:lvgl8]
build_type = release
lib_deps = lvgl/lvgl@^8.4
build_flags =
  -I ./src
  -I ./src/ui
  -D LV_CONF_INCLUDE_SIMPLE
  -D LVGL_VERSION=8
  -Wno-cast-align
  -Wno-error=cast-align
